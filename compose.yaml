name: alfa-news

x-backend-env: &backend-env
  DOTNET_ENVIRONMENT: Development
  ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-alfanews};Username=${POSTGRES_USER:-alfanews};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  Storage__RootPath: /var/lib/alfanews/research
  Data__InputPath: /input
  Embeddings__BaseUrl: http://tei:80
  Embeddings__Model: intfloat/multilingual-e5-base

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alfanews}
      POSTGRES_USER: ${POSTGRES_USER:-alfanews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    restart: unless-stopped
    command: [--model-id, intfloat/multilingual-e5-base, --port, "80", --dtype, float32]
    volumes:
      - embeddings-cache:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", http://localhost/health]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: backend/AlfaNews.Api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - research-files:/var/lib/alfanews/research
      - ./data:/input:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8080"]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", http://localhost:8080/openapi/v1.json]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: backend/AlfaNews.Worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
      Llm__UseMock: ${LLM_USE_MOCK:-true}
      Llm__BaseUrl: ${LLM_BASE_URL:-}
      Llm__ApiKey: ${LLM_API_KEY:-}
      Llm__AgentModel: ${DEEPSEEK_MODEL_ID:-}
      Llm__ClassifierModel: ${DEEPSEEK_MODEL_ID:-}
      Llm__PdfModel: ${GLM_MODEL_ID:-}
      Llm__CriticModel: ${GLM_MODEL_ID:-}
      Llm__GlmReasoningLevel: high
      Llm__MaxOutputTokens: "32000"
      Llm__ChatMaxOutputTokens: "8000"
    volumes:
      - research-files:/var/lib/alfanews/research
      - ./data:/input:ro
    depends_on:
      postgres:
        condition: service_healthy
      tei:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_USE_MOCKS: "true"
    expose: ["3000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    configs:
      - source: nginx-config
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/login]
      interval: 10s
      timeout: 5s
      retries: 10

configs:
  nginx-config:
    content: |
      server {
        listen 80;
        server_name _;
        client_max_body_size 52m;
        resolver 127.0.0.11 valid=10s ipv6=off;

        location /api/ {
          set $$api_upstream http://api:8080;
          proxy_pass $$api_upstream;
          proxy_set_header Host $$http_host;
          proxy_set_header X-Forwarded-Host $$http_host;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_read_timeout 60s;
        }

        location / {
          set $$web_upstream http://web:3000;
          proxy_pass $$web_upstream;
          proxy_http_version 1.1;
          proxy_set_header Host $$http_host;
          proxy_set_header X-Forwarded-Host $$http_host;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
        }
      }

volumes:
  postgres-data:
  research-files:
  embeddings-cache: