name: alfa-news

x-backend-env: &backend-env
    DOTNET_ENVIRONMENT: Development
    ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-alfanews};Username=${POSTGRES_USER:-alfanews};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    Storage__RootPath: /var/lib/alfanews/research
    Data__InputPath: /input
    Embeddings__BaseUrl: http://tei:80
    Embeddings__Model: intfloat/multilingual-e5-base

services:
    postgres:
        image: pgvector/pgvector:pg17
        restart: unless-stopped
        ports:
            - "127.0.0.1:15432:5432"
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-alfanews}
            POSTGRES_USER: ${POSTGRES_USER:-alfanews}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: [ CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"' ]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s
    
    tei:
        image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
        restart: unless-stopped
        ports:
            - "127.0.0.1:18081:80"
        entrypoint: [ /bin/sh, /etc/tei/start-int8.sh ]
        command: [ --model-id, /data/e5-base-int8-d128750597153bb5987e10b1c3493a34e5a4502a, --served-model-name, intfloat/multilingual-e5-base, --port, "80", --dtype, float32 ]
        configs:
            -   source: tei-int8-startup
                target: /etc/tei/start-int8.sh
        volumes:
            - embeddings-cache:/data
        healthcheck:
            test: [ CMD, curl, --fail, --silent, --max-time, "5", http://localhost/health ]
            interval: 10s
            timeout: 10s
            retries: 60
            start_period: 60s
    
    migrate:
        build:
            context: .
            dockerfile: backend/AlfaNews.Api/Dockerfile
        environment:
            <<: *backend-env
        command: [ --migrate ]
        depends_on:
            postgres:
                condition: service_healthy

    api:
        build:
            context: .
            dockerfile: backend/AlfaNews.Api/Dockerfile
        restart: unless-stopped
        environment:
            <<: *backend-env
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_URLS: http://+:8080
            Auth__DemoPassword: ${DEMO_LOGIN_PASSWORD:-}
            # Изменяющие запросы принимаются только с внешнего адреса шлюза (сайт и API на одном origin).
            Auth__AllowedOrigins__0: ${PUBLIC_ORIGIN:-http://localhost:${HTTP_PORT:-8080}}
            Auth__AllowedOrigins__1: http://127.0.0.1:${HTTP_PORT:-8080}
            Feed__Mode: ${FEED_MODE:-live}
        volumes:
            - research-files:/var/lib/alfanews/research
            - ./data:/input:ro
        depends_on:
            postgres:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        expose: [ "8080" ]
        healthcheck:
            test: [ CMD, curl, --fail, --silent, --max-time, "5", http://localhost:8080/openapi/v1.json ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 15s
    
    worker:
        build:
            context: .
            dockerfile: backend/AlfaNews.Worker/Dockerfile
        restart: unless-stopped
        environment:
            <<: *backend-env
            Data__ImportOnStartup: "true"
            Data__DatasetVersion: hackathon-2026-v1
            Data__ImportReportPath: /reports/import_report.json
            Data__BuildProfilesOnStartup: "true"
            Data__ProfilesReportPath: /reports/profile_candidates.json
            Feed__CompanyIds: ${FEED_COMPANY_IDS:-}
            Feed__RefreshIntervalSeconds: ${FEED_REFRESH_INTERVAL_SECONDS:-86400}
            Ranking__MinBase: ${RANKING_MIN_BASE:-0.30}
            Ranking__MinScore: ${RANKING_MIN_SCORE:-0.15}
            Queue__NewsSlots: ${QUEUE_NEWS_SLOTS:-4}
            Queue__DocumentsSlots: ${QUEUE_DOCUMENTS_SLOTS:-3}
            Queue__InsightsSlots: ${QUEUE_INSIGHTS_SLOTS:-2}
            Queue__ChatSlots: ${QUEUE_CHAT_SLOTS:-2}
            Llm__MaxParallelRequests: ${LLM_MAX_PARALLEL_REQUESTS:-8}
            TestJob__Enabled: ${TEST_JOB_ENABLED:-false}
            TestJob__Text: ${TEST_JOB_TEXT:-Очередь Worker работает.}
            Llm__UseMock: ${LLM_USE_MOCK:-true}
            Llm__BaseUrl: ${LLM_BASE_URL:-}
            Llm__ApiKey: ${LLM_API_KEY:-}
            Llm__DeepSeekModel: ${DEEPSEEK_MODEL_ID:-deepseek/deepseek-v4.1-flash}
            Llm__GlmModel: ${GLM_MODEL_ID:-z-ai/glm-5.3-flash}
            Llm__GlmReasoningLevel: ${LLM_GLM_REASONING_LEVEL:-low}
            Llm__DeepSeekThinkingEnabled: ${LLM_DEEPSEEK_THINKING_ENABLED:-true}
            Llm__MaxOutputTokens: "32000"
            Llm__ChatMaxOutputTokens: "8000"
            Llm__DeepSeekInputEstimateRubPerMillion: ${LLM_DEEPSEEK_INPUT_ESTIMATE_RUB_PER_MILLION:-55}
            Llm__StructuredOutput: ${LLM_STRUCTURED_OUTPUT:-true}
            Llm__DeepSeekOutputEstimateRubPerMillion: ${LLM_DEEPSEEK_OUTPUT_ESTIMATE_RUB_PER_MILLION:-100}
            Llm__GlmInputEstimateRubPerMillion: ${LLM_GLM_INPUT_ESTIMATE_RUB_PER_MILLION:-22}
            Llm__GlmOutputEstimateRubPerMillion: ${LLM_GLM_OUTPUT_ESTIMATE_RUB_PER_MILLION:-50}
            Llm__CriticEnabled: ${CRITIC_ENABLED:-true}
            Llm__CriticScope: ${CRITIC_SCOPE:-all_full}
            Llm__DailyLimitRub: ${LLM_DAILY_LIMIT_RUB:-500}
        volumes:
            - research-files:/var/lib/alfanews/research
            - ./data:/input:ro
            - ./data/reports:/reports
        depends_on:
            postgres:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
            tei:
                condition: service_healthy
    
    web:
        build:
            context: ./web
            dockerfile: Dockerfile
        restart: unless-stopped
        environment:
            NODE_ENV: production
            HOSTNAME: 0.0.0.0
            PORT: "3000"
            NEXT_PUBLIC_USE_MOCKS: "false"
        expose: [ "3000" ]
        healthcheck:
            test: [ CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 15s
    
    gateway:
        image: nginx:stable-alpine
        restart: unless-stopped
        ports:
            - "127.0.0.1:${HTTP_PORT:-8080}:80"
        configs:
            -   source: nginx-config
                target: /etc/nginx/conf.d/default.conf
        depends_on:
            api:
                condition: service_healthy
            web:
                condition: service_healthy
        healthcheck:
            test: [ CMD, wget, -q, --spider, http://127.0.0.1/login ]
            interval: 10s
            timeout: 5s
            retries: 10

configs:
    tei-int8-startup:
        content: |
            set -eu
            revision=d128750597153bb5987e10b1c3493a34e5a4502a
            model_dir=/data/e5-base-int8-$${revision}
            base_url=https://huggingface.co/intfloat/multilingual-e5-base/resolve/$${revision}
            mkdir -p "$${model_dir}/1_Pooling"
            
            download() {
              source_path=$$1
              target_path=$$2
              if [ ! -s "$$target_path" ]; then
                curl --fail --location --silent --show-error --retry 3 --connect-timeout 10 --max-time 900 "$$base_url/$$source_path" -o "$$target_path.part"
                mv "$$target_path.part" "$$target_path"
              fi
            }
            
            for file in config.json tokenizer.json tokenizer_config.json sentence_bert_config.json 1_Pooling/config.json; do
              download "$$file" "$$model_dir/$$file"
            done
            download onnx/model_qint8_avx512_vnni.onnx "$$model_dir/model.onnx"
            printf '%s  %s\n' 2523551878658b305550d8759443822dbfda9ed9c8012ef2c354ba2c5b9de503 "$$model_dir/model.onnx" | sha256sum -c -
            exec text-embeddings-router "$$@"
    
    nginx-config:
        content: |
            server {
              listen 80;
              server_name _;
              client_max_body_size 52m;
              resolver 127.0.0.11 valid=10s ipv6=off;
            
              location /api/ {
                set $$api_upstream http://api:8080;
                proxy_pass $$api_upstream;
                proxy_set_header Host $$http_host;
                proxy_set_header X-Forwarded-Host $$http_host;
                proxy_set_header X-Forwarded-Proto $$scheme;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_read_timeout 60s;
              }
            
              location / {
                set $$web_upstream http://web:3000;
                proxy_pass $$web_upstream;
                proxy_http_version 1.1;
                proxy_set_header Host $$http_host;
                proxy_set_header X-Forwarded-Host $$http_host;
                proxy_set_header X-Forwarded-Proto $$scheme;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              }
            }

volumes:
    postgres-data:
    research-files:
    embeddings-cache: