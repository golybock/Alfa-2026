# Example for the repository root. Requires Docker Compose >= 2.23.1.
# Expected Dockerfiles: backend/AlfaNews.Api/Dockerfile,
# backend/AlfaNews.Worker/Dockerfile, web/Dockerfile.
# .NET configuration section names below must be matched to the actual code.
name: alfa-news

x-backend-env: &backend-env
  DOTNET_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
  ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-alfanews};Username=${POSTGRES_USER:-alfanews};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  Storage__RootPath: /var/lib/alfanews/research
  Data__InputPath: /input
  Embeddings__BaseUrl: http://tei:80
  Embeddings__Model: intfloat/multilingual-e5-base

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alfanews}
      POSTGRES_USER: ${POSTGRES_USER:-alfanews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  tei:
    # x86_64 CPU. For ARM use the cpu-arm64-1.9 image after checking the host.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    restart: unless-stopped
    command: [--model-id, intfloat/multilingual-e5-base, --port, "80", --dtype, float32]
    volumes:
      - embeddings-cache:/data

  api:
    build:
      context: ./backend
      dockerfile: AlfaNews.Api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - research-files:/var/lib/alfanews/research
      - ./data:/input:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8080"]

  worker:
    build:
      context: ./backend
      dockerfile: AlfaNews.Worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
      # Exact provider model IDs are supplied by the server configuration.
      Llm__BaseUrl: ${LLM_BASE_URL:?Set LLM_BASE_URL in .env}
      Llm__ApiKey: ${LLM_API_KEY:?Set LLM_API_KEY in .env}
      Llm__AgentModel: ${DEEPSEEK_MODEL_ID:?Set the provider ID for DeepSeek v4.1 Flash}
      Llm__ClassifierModel: ${DEEPSEEK_MODEL_ID:?Set the provider ID for DeepSeek v4.1 Flash}
      Llm__PdfModel: ${GLM_MODEL_ID:?Set the provider ID for GLM 5.3 Flash}
      Llm__CriticModel: ${GLM_MODEL_ID:?Set the provider ID for GLM 5.3 Flash}
      Llm__GlmReasoningLevel: high
      Llm__MaxOutputTokens: "32000"
      Llm__ChatMaxOutputTokens: "8000"
    volumes:
      - research-files:/var/lib/alfanews/research
      - ./data:/input:ro
    depends_on:
      postgres:
        condition: service_healthy
      tei:
        condition: service_started
    # Worker image must contain pdftoppm (poppler-utils).
    # The worker must wait/retry while TEI downloads and loads the model.

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose: ["3000"]
    # Browser requests use relative /api URLs; no LLM secrets enter this image.

  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    configs:
      - source: nginx-config
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started

configs:
  nginx-config:
    content: |
      server {
        listen 80;
        server_name _;
        # 50 MiB PDF plus multipart overhead. API enforces the file limit.
        client_max_body_size 52m;
        resolver 127.0.0.11 valid=10s ipv6=off;

        location /api/ {
          set $$api_upstream http://api:8080;
          proxy_pass $$api_upstream;
          proxy_set_header Host $$http_host;
          proxy_set_header X-Forwarded-Host $$http_host;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_read_timeout 60s;
        }

        location / {
          set $$web_upstream http://web:3000;
          proxy_pass $$web_upstream;
          proxy_http_version 1.1;
          proxy_set_header Host $$http_host;
          proxy_set_header X-Forwarded-Host $$http_host;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
        }
      }

volumes:
  postgres-data:
  research-files:
  embeddings-cache: